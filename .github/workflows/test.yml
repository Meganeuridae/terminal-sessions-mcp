name: Test

on:
  pull_request:
  push:
    branches: [main, redesign/m1]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish openssh-server
      - name: Secure zsh completion paths (Linux)
        if: runner.os == 'Linux'
        # Ubuntu's global compinit otherwise waits for an answer about the hosted
        # runner's writable completion paths. Repair them, keeping the audit on.
        run: |
          audit=$(mktemp)
          trap 'rm -f "$audit"' EXIT
          zsh -fc 'autoload -Uz compaudit; compaudit' > "$audit" || true
          cat "$audit"
          while IFS= read -r completion_path; do
            sudo chmod go-w -- "$completion_path"
          done < "$audit"
          zsh -fc 'autoload -Uz compaudit; compaudit'
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew list fish >/dev/null 2>&1 || brew install fish
      - run: npm ci
      # Fail early with the shell's startup output instead of leaving later
      # interactive-shell tests waiting behind an unread startup prompt.
      - name: Check shell startup
        run: npm run build && node --test --test-name-pattern='G5 rich integration is observed' next/dist/spec/pty.spec.js
      - run: npm test

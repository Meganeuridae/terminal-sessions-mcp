<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Sessions</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #c9d1d9; --dim: #8b949e;
      --accent: #58a6ff; --ok: #3fb950; --bad: #f85149; --warn: #d29922;
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --panel: #f6f8fa; --line: #d0d7de; --text: #1f2328; --dim: #57606a;
      --accent: #0969da; --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: var(--panel); border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 14px; font-weight: 600; }
    header .conn { margin-left: auto; color: var(--dim); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
    main { flex: 1; display: flex; min-height: 0; }
    aside {
      width: 240px; background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0;
    }
    aside h2, .activity h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
      padding: 10px 12px 6px;
    }
    #sessions { overflow: auto; flex: 1; }
    .session { padding: 8px 12px; cursor: pointer; border-left: 3px solid transparent; }
    .session:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .session.active { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .session .name { font-weight: 600; }
    .session .meta { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .new { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
    input[type=text] {
      flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 8px; font: inherit;
    }
    button {
      background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
      padding: 5px 10px; font: inherit; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger:hover { border-color: var(--bad); color: var(--bad); }
    button:disabled { opacity: .5; cursor: default; }
    section.view { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .bar {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px; flex-wrap: wrap;
      border-bottom: 1px solid var(--line); background: var(--panel);
    }
    /* `display: flex` would beat the browser's rule for `hidden`: the bar showed before any selection. */
    .bar[hidden] { display: none; }
    .bar .title { font-weight: 600; }
    .bar .info { color: var(--dim); }
    .bar .spacer { flex: 1; }
    .seat { padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); }
    .seat.mine { border-color: var(--ok); color: var(--ok); }
    .body { flex: 1; display: flex; min-height: 0; }
    #term-wrap { flex: 1; overflow: auto; padding: 8px; background: #0d1117; min-width: 0; }
    /* The fit addon measures #term: it fills the pane, so the controller's rows follow the window too (tsg-11). */
    #term { height: 100%; }
    #notice { padding: 6px 12px; color: var(--warn); display: none; border-bottom: 1px solid var(--line); }
    .activity { width: 300px; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
    #activity { overflow: auto; flex: 1; padding: 0 12px 12px; }
    .item { padding: 6px 0; border-bottom: 1px solid var(--line); }
    .item .who { color: var(--dim); font-size: 12px; }
    .item code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .item .note { white-space: pre-wrap; font-style: italic; }
    .run-out summary { cursor: pointer; color: var(--dim); font-size: 12px; }
    .run-out pre {
      max-height: 240px; overflow: auto; margin-top: 4px; padding: 6px; background: var(--bg);
      border: 1px solid var(--line); border-radius: 6px; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; word-break: break-all;
    }
    .run-out .stderr { color: var(--bad); }
    .run-out .cut { color: var(--dim); font-style: italic; }
    button.secret.on { border-color: var(--warn); color: var(--warn); }
    select {
      background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px; font: inherit;
    }
    .ok { color: var(--ok); } .bad { color: var(--bad); } .dim { color: var(--dim); }
    .empty { color: var(--dim); padding: 40px; text-align: center; margin: auto; }
    @media (max-width: 900px) { .activity { display: none; } aside { width: 180px; } }
  </style>
</head>
<body>
  <header>
    <h1>Terminal Sessions</h1>
    <span class="dim" id="node"></span>
    <span class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">connecting</span></span>
  </header>
  <main>
    <aside>
      <h2>Sessions</h2>
      <div id="sessions"></div>
      <form class="new" id="new-form">
        <input type="text" id="new-name" placeholder="new session" autocomplete="off" spellcheck="false">
        <select id="new-vis" title="Private: only you (not even agents using your token). Shared: every authenticated principal may observe it and take a free seat.">
          <option value="private">private</option>
          <option value="shared">shared</option>
        </select>
        <button type="submit">Open</button>
      </form>
    </aside>
    <section class="view">
      <div class="bar" id="bar" hidden>
        <span class="title" id="title"></span>
        <span class="info" id="info"></span>
        <span class="spacer"></span>
        <span class="seat" id="seat"></span>
        <button id="seat-btn"></button>
        <button id="secret" class="secret" aria-pressed="false">Secret: off</button>
        <button id="ctrlc" title="Send ^C to the foreground job">^C</button>
        <button id="close" class="danger" title="End the session's shell">Close</button>
      </div>
      <div id="notice"></div>
      <div class="body">
        <div id="term-wrap"><div class="empty" id="empty">Select a session</div><div id="term"></div></div>
        <div class="activity"><h2>Activity</h2><div id="activity"></div></div>
      </div>
    </section>
  </main>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
